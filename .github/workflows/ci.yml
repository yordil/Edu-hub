name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, migrations & tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt ruff

      - name: Lint
        run: ruff check app tests --select E9,F63,F7,F82

      # Tests spin up a real pgvector Postgres via Testcontainers (Docker is preinstalled on ubuntu runners).
      # They include the migration-drift check and the offline guardrail eval suite.
      - name: Run tests
        env:
          LLM_PROVIDER: fake
        run: pytest -q --junitxml=reports/junit.xml

      - name: Upload eval & test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: reports/

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: eduhub-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
